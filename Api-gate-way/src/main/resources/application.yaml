server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: bank-redis
      port: 6379


  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: account-service
              uri: http://account-service:8082
              predicates:
                - Path=/accounts/**,/profile/**,/admin/accounts/**,/admin/profiles/**
              filters:
                - addUserHeaders
                - RateLimiter
            - id : auth-public
              uri: http://auth-service:8081
              predicates:
                - Path=/Auth/login,/Auth/register,/Auth/refresh,/Auth/logout,Auth/send-otp,/Auth/verify-otp

            - id : auth-admin
              uri: http://auth-service:8081
              predicates:
                - Path=/admin/auth/**
              filters:
                - addUserHeaders
                - RateLimiter

            - id: Transaction-services
              uri: http://transaction-service:8083
              predicates:
                - Path=/payment-transactions/**
              filters:
                - addUserHeaders
                - RateLimiter


jwt:
  secret: ${JWT_SECRET_KEY}

rate-limit:
  max-requests: 25
  window: 2m